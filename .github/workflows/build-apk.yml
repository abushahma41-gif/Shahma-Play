              "app/src/main/java/com/example/shahma/MediaItemModel.kt": """
              package com.example.shahma

              import android.net.Uri

              data class MediaItemModel(
                  val id: Long,
                  val title: String,
                  val durationMs: Long,
                  val sizeBytes: Long,
                  val uri: Uri,
                  val isAudio: Boolean
              )
              """,
              "app/src/main/java/com/example/shahma/MediaAdapter.kt": """
              package com.example.shahma

              import android.os.Build
              import android.provider.MediaStore
              import android.util.Size
              import android.view.LayoutInflater
              import android.view.ViewGroup
              import androidx.recyclerview.widget.RecyclerView
              import com.example.shahma.databinding.ItemMediaBinding
              import java.util.concurrent.TimeUnit

              class MediaAdapter(
                  private val items: List<MediaItemModel>,
                  private val onClick: (MediaItemModel) -> Unit
              ) : RecyclerView.Adapter<MediaAdapter.Holder>() {

                  inner class Holder(val binding: ItemMediaBinding) : RecyclerView.ViewHolder(binding.root)

                  override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): Holder {
                      val binding = ItemMediaBinding.inflate(LayoutInflater.from(parent.context), parent, false)
                      return Holder(binding)
                  }

                  override fun onBindViewHolder(holder: Holder, position: Int) {
                      val item = items[position]
                      holder.binding.titleText.text = item.title
                      holder.binding.metaText.text = "${formatDuration(item.durationMs)} • ${formatSize(item.sizeBytes)}"
                      val context = holder.itemView.context

                      if (item.isAudio) {
                          holder.binding.thumbnailView.setImageResource(android.R.drawable.ic_media_play)
                      } else {
                          try {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  val thumb = context.contentResolver.loadThumbnail(item.uri, Size(320, 180), null)
                                  holder.binding.thumbnailView.setImageBitmap(thumb)
                              } else {
                                  @Suppress("DEPRECATION")
                                  val thumb = MediaStore.Video.Thumbnails.getThumbnail(
                                      context.contentResolver, item.id,
                                      MediaStore.Video.Thumbnails.MINI_KIND, null
                                  )
                                  holder.binding.thumbnailView.setImageBitmap(thumb)
                              }
                          } catch (_: Exception) {
                              holder.binding.thumbnailView.setImageDrawable(null)
                          }
                      }

                      holder.itemView.setOnClickListener { onClick(item) }
                  }

                  override fun getItemCount(): Int = items.size

                  private fun formatDuration(ms: Long): String {
                      val hours = TimeUnit.MILLISECONDS.toHours(ms)
                      val minutes = TimeUnit.MILLISECONDS.toMinutes(ms) % 60
                      val seconds = TimeUnit.MILLISECONDS.toSeconds(ms) % 60
                      return if (hours > 0) String.format("%d:%02d:%02d", hours, minutes, seconds)
                      else String.format("%02d:%02d", minutes, seconds)
                  }

                  private fun formatSize(bytes: Long): String {
                      val mb = bytes / (1024.0 * 1024.0)
                      return if (mb >= 1024) String.format("%.2f GB", mb / 1024.0)
                      else String.format("%.1f MB", mb)
                  }
              }
              """,
              "app/src/main/java/com/example/shahma/MainActivity.kt": """
              package com.example.shahma

              import android.Manifest
              import android.content.ContentUris
              import android.content.Intent
              import android.content.pm.PackageManager
              import android.os.Build
              import android.os.Bundle
              import android.provider.MediaStore
              import android.view.View
              import android.widget.EditText
              import android.widget.Toast
              import androidx.activity.result.contract.ActivityResultContracts
              import androidx.appcompat.app.AlertDialog
              import androidx.appcompat.app.AppCompatActivity
              import androidx.core.content.ContextCompat
              import androidx.recyclerview.widget.LinearLayoutManager
              import com.example.shahma.databinding.ActivityMainBinding
              import com.google.android.material.tabs.TabLayout

              class MainActivity : AppCompatActivity() {

                  private lateinit var binding: ActivityMainBinding
                  private var showAudio = false

                  private val permissionLauncher =
                      registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) { result ->
                          if (result.values.any { it }) loadMedia()
                          else {
                              binding.emptyText.visibility = View.VISIBLE
                              binding.emptyText.text = "Storage permission is required to list media."
                          }
                      }

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      binding = ActivityMainBinding.inflate(layoutInflater)
                      setContentView(binding.root)

                      binding.mediaRecyclerView.layoutManager = LinearLayoutManager(this)

                      binding.tabLayout.addOnTabSelectedListener(object : TabLayout.OnTabSelectedListener {
                          override fun onTabSelected(tab: TabLayout.Tab) {
                              showAudio = (tab.position == 1)
                              loadMedia()
                          }
                          override fun onTabUnselected(tab: TabLayout.Tab) {}
                          override fun onTabReselected(tab: TabLayout.Tab) {}
                      })

                      binding.streamBtn.setOnClickListener { showStreamDialog() }
                      checkPermissionsAndLoad()
                  }

                  private fun showStreamDialog() {
                      val input = EditText(this).apply {
                          hint = "https://example.com/video.mp4"
                      }
                      AlertDialog.Builder(this)
                          .setTitle("Open Network Stream")
                          .setView(input)
                          .setPositiveButton("Play") { _, _ ->
                              val url = input.text.toString().trim()
                              if (url.isNotEmpty()) {
                                  val intent = Intent(this, PlayerActivity::class.java).apply {
                                      putExtra("MEDIA_URI", url)
                                      putExtra("MEDIA_TITLE", "Network Stream")
                                  }
                                  startActivity(intent)
                              } else {
                                  Toast.makeText(this, "Enter a valid URL", Toast.LENGTH_SHORT).show()
                              }
                          }
                          .setNegativeButton("Cancel", null)
                          .show()
                  }

                  private fun checkPermissionsAndLoad() {
                      val perms = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          arrayOf(Manifest.permission.READ_MEDIA_VIDEO, Manifest.permission.READ_MEDIA_AUDIO)
                      } else {
                          arrayOf(Manifest.permission.READ_EXTERNAL_STORAGE)
                      }
                      val allGranted = perms.all {
                          ContextCompat.checkSelfPermission(this, it) == PackageManager.PERMISSION_GRANTED
                      }
                      if (allGranted) loadMedia()
                      else permissionLauncher.launch(perms)
                  }

                  private fun loadMedia() {
                      val list = mutableListOf<MediaItemModel>()
                      val contentUri = if (showAudio) MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                      else MediaStore.Video.Media.EXTERNAL_CONTENT_URI

                      val projection = arrayOf(
                          MediaStore.MediaColumns._ID,
                          MediaStore.MediaColumns.DISPLAY_NAME,
                          MediaStore.MediaColumns.DURATION,
                          MediaStore.MediaColumns.SIZE
                      )
                      val sortOrder = "${MediaStore.MediaColumns.DATE_ADDED} DESC"

                      contentResolver.query(contentUri, projection, null, null, sortOrder)?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.MediaColumns._ID)
                          val nameCol = cursor.getColumnIndexOrThrow(MediaStore.MediaColumns.DISPLAY_NAME)
                          val durCol = cursor.getColumnIndexOrThrow(MediaStore.MediaColumns.DURATION)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.MediaColumns.SIZE)

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(idCol)
                              val name = cursor.getString(nameCol) ?: "Unknown"
                              val dur = cursor.getLong(durCol)
                              val size = cursor.getLong(sizeCol)
                              val itemUri = ContentUris.withAppendedId(contentUri, id)
                              list.add(MediaItemModel(id, name, dur, size, itemUri, showAudio))
                          }
                      }

                      if (list.isEmpty()) {
                          binding.emptyText.visibility = View.VISIBLE
                          binding.mediaRecyclerView.adapter = null
                      } else {
                          binding.emptyText.visibility = View.GONE
                          binding.mediaRecyclerView.adapter = MediaAdapter(list) { item ->
                              val intent = Intent(this, PlayerActivity::class.java).apply {
                                  putExtra("MEDIA_URI", item.uri.toString())
                                  putExtra("MEDIA_TITLE", item.title)
                              }
                              startActivity(intent)
                          }
                      }
                  }
              }
              """,
              "app/src/main/java/com/example/shahma/PlayerActivity.kt": """
              package com.example.shahma

              import android.annotation.SuppressLint
              import android.content.Context
              import android.content.pm.ActivityInfo
              import android.media.AudioManager
              import android.net.Uri
              import android.os.Bundle
              import android.view.GestureDetector
              import android.view.MotionEvent
              import android.view.View
              import android.view.WindowManager
              import androidx.annotation.OptIn
              import androidx.appcompat.app.AlertDialog
              import androidx.appcompat.app.AppCompatActivity
              import androidx.core.view.WindowCompat
              import androidx.core.view.WindowInsetsCompat
              import androidx.core.view.WindowInsetsControllerCompat
              import androidx.media3.common.C
              import androidx.media3.common.MediaItem
              import androidx.media3.common.PlaybackParameters
              import androidx.media3.common.TrackSelectionOverride
              import androidx.media3.common.util.UnstableApi
              import androidx.media3.exoplayer.ExoPlayer
              import androidx.media3.ui.AspectRatioFrameLayout
              import com.example.shahma.databinding.ActivityPlayerBinding
              import kotlin.math.abs

              class PlayerActivity : AppCompatActivity() {

                  private lateinit var binding: ActivityPlayerBinding
                  private var player: ExoPlayer? = null
                  private lateinit var audioManager: AudioManager
                  private lateinit var gestureDetector: GestureDetector

                  private var isLocked = false
                  private var isLandscape = true
                  private val speeds = listOf(0.5f, 0.75f, 1.0f, 1.25f, 1.5f, 2.0f)
                  private var speedIndex = 2

                  private val resizeModes = listOf(
                      AspectRatioFrameLayout.RESIZE_MODE_FIT to "Fit",
                      AspectRatioFrameLayout.RESIZE_MODE_ZOOM to "Crop",
                      AspectRatioFrameLayout.RESIZE_MODE_FILL to "Stretch"
                  )
                  private var resizeIndex = 0

                  override fun onCreate(savedInstanceState: Bundle?) {
                      super.onCreate(savedInstanceState)
                      binding = ActivityPlayerBinding.inflate(layoutInflater)
                      setContentView(binding.root)

                      hideSystemUI()
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                      audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                      val uriString = intent.getStringExtra("MEDIA_URI")
                      val title = intent.getStringExtra("MEDIA_TITLE") ?: "Shahma Player"
                      binding.videoTitle.text = title

                      if (uriString != null) initializePlayer(Uri.parse(uriString))
                      setupControls()
                      setupGestures()
                  }

                  private fun initializePlayer(uri: Uri) {
                      player = ExoPlayer.Builder(this).build().also { exo ->
                          binding.playerView.player = exo
                          exo.setMediaItem(MediaItem.fromUri(uri))
                          exo.prepare()
                          exo.playWhenReady = true
                      }
                  }

                  @OptIn(UnstableApi::class)
                  private fun setupControls() {
                      binding.backBtn.setOnClickListener { finish() }

                      binding.tracksBtn.setOnClickListener { showTracksDialog() }

                      binding.speedBtn.setOnClickListener {
                          speedIndex = (speedIndex + 1) % speeds.size
                          val newSpeed = speeds[speedIndex]
                          player?.playbackParameters = PlaybackParameters(newSpeed)
                          binding.speedBtn.text = "${newSpeed}x"
                      }

                      binding.aspectBtn.setOnClickListener {
                          resizeIndex = (resizeIndex + 1) % resizeModes.size
                          val (mode, label) = resizeModes[resizeIndex]
                          binding.playerView.resizeMode = mode
                          binding.aspectBtn.text = label
                      }

                      binding.rotateBtn.setOnClickListener {
                          isLandscape = !isLandscape
                          requestedOrientation = if (isLandscape) {
                              ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                          } else {
                              ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          }
                      }

                      binding.lockBtn.setOnClickListener {
                          isLocked = !isLocked
                          binding.playerView.useController = !isLocked
                          binding.lockBtn.text = if (isLocked) "Unlock" else "Lock"
                          val vis = if (isLocked) View.GONE else View.VISIBLE
                          binding.backBtn.visibility = vis
                          binding.tracksBtn.visibility = vis
                          binding.speedBtn.visibility = vis
                          binding.aspectBtn.visibility = vis
                          binding.rotateBtn.visibility = vis
                      }
                  }

                  private fun showTracksDialog() {
                      val exo = player ?: return
                      val labels = mutableListOf<String>()
                      val actions = mutableListOf<() -> Unit>()

                      labels.add("Disable Subtitles")
                      actions.add {
                          exo.trackSelectionParameters = exo.trackSelectionParameters.buildUpon()
                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                              .build()
                      }

                      for (group in exo.currentTracks.groups) {
                          val type = group.type
                          if (type == C.TRACK_TYPE_AUDIO || type == C.TRACK_TYPE_TEXT) {
                              val typeLabel = if (type == C.TRACK_TYPE_AUDIO) "Audio" else "Subtitle"
                              for (i in 0 until group.length) {
                                  val format = group.getTrackFormat(i)
                                  val lang = format.language ?: "Track ${i + 1}"
                                  val selected = if (group.isTrackSelected(i)) " (Active)" else ""
                                  labels.add("$typeLabel: $lang$selected")
                                  actions.add {
                                      exo.trackSelectionParameters = exo.trackSelectionParameters.buildUpon()
                                          .setTrackTypeDisabled(type, false)
                                          .setOverrideForType(TrackSelectionOverride(group.mediaTrackGroup, i))
                                          .build()
                                  }
                              }
                          }
                      }

                      AlertDialog.Builder(this)
                          .setTitle("Audio & Subtitles")
                          .setItems(labels.toTypedArray()) { _, which -> actions[which]() }
                          .setNegativeButton("Close", null)
                          .show()
                  }

                  @SuppressLint("ClickableViewAccessibility")
                  private fun setupGestures() {
                      gestureDetector = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                          override fun onDoubleTap(e: MotionEvent): Boolean {
                              if (isLocked) return false
                              val exo = player ?: return false
                              val width = binding.playerView.width
                              if (e.x < width / 2f) {
                                  exo.seekTo((exo.currentPosition - 10_000).coerceAtLeast(0))
                                  showOverlay("-10s")
                              } else {
                                  exo.seekTo(exo.currentPosition + 10_000)
                                  showOverlay("+10s")
                              }
                              return true
                          }

                          override fun onScroll(e1: MotionEvent?, e2: MotionEvent, distanceX: Float, distanceY: Float): Boolean {
                              if (isLocked || e1 == null) return false
                              val width = binding.playerView.width.toFloat()
                              if (abs(distanceY) > abs(distanceX)) {
                                  if (e1.x < width / 2f) adjustBrightness(distanceY / 500f)
                                  else adjustVolume(distanceY / 40f)
                                  return true
                              }
                              return false
                          }
                      })
                      binding.playerView.setOnTouchListener { _, event ->
                          gestureDetector.onTouchEvent(event)
                          if (event.action == MotionEvent.ACTION_UP) {
                              binding.gestureOverlay.postDelayed({
                                  binding.gestureOverlay.visibility = View.GONE
                              }, 700)
                          }
                          false
                      }
                  }

                  private fun adjustBrightness(delta: Float) {
                      val lp: WindowManager.LayoutParams = window.attributes
                      val current = if (lp.screenBrightness < 0) 0.5f else lp.screenBrightness
                      val next = (current + delta).coerceIn(0.05f, 1.0f)
                      lp.screenBrightness = next
                      window.attributes = lp
                      showOverlay("Brightness: ${(next * 100).toInt()}%")
                  }

                  private fun adjustVolume(delta: Float) {
                      val maxVol = audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC)
                      val currentVol = audioManager.getStreamVolume(AudioManager.STREAM_MUSIC)
                      val step = if (delta > 0) 1 else -1
                      val nextVol = (currentVol + step).coerceIn(0, maxVol)
                      audioManager.setStreamVolume(AudioManager.STREAM_MUSIC, nextVol, 0)
                      showOverlay("Volume: ${(nextVol * 100) / maxVol}%")
                  }

                  private fun showOverlay(text: String) {
                      binding.gestureOverlay.text = text
                      binding.gestureOverlay.visibility = View.VISIBLE
                  }

                  private fun hideSystemUI() {
                      WindowCompat.setDecorFitsSystemWindows(window, false)
                      WindowInsetsControllerCompat(window, binding.root).let { controller ->
                          controller.hide(WindowInsetsCompat.Type.systemBars())
                          controller.systemBarsBehavior =
                              WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      }
                  }

                  override fun onStop() {
                      super.onStop()
                      player?.pause()
                  }

                  override fun onDestroy() {
                      super.onDestroy()
                      player?.release()
                      player = null
                  }
              }
              """
          }

          for path, content in files.items():
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip("\n"))
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shahma-APK
          path: app/build/outputs/apk/debug/app-debug.apk
